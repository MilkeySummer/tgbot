databaseChangeLog:
  - changeSet:
      id: add-date-columns
      author: your-name
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: INCOMES
                columnName: operation_date
      changes:
        - addColumn:
            tableName: INCOMES
            columns:
              - column:
                  name: operation_date
                  type: date
                  defaultValueComputed: CURRENT_DATE
                  constraints:
                    nullable: false
        - addColumn:
            tableName: SPEND
            columns:
              - column:
                  name: operation_date
                  type: date
                  defaultValueComputed: CURRENT_DATE
                  constraints:
                    nullable: false